name: Build QBLHook dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          # theos/sdks 仓库直接 clone，里面就是解压好的 sdk
          git clone --depth 1 https://github.com/theos/sdks.git tmp_sdks
          mv tmp_sdks/*.sdk . 2>/dev/null || true
          rm -rf tmp_sdks
          ls -la

      - name: Build
        run: |
          make clean || true
          make
          echo "=== dylib 产物 ==="
          find . -name "*.dylib" -not -path "./.git/*" -exec ls -la {} \;

      - name: Sign (ldid)
        run: |
          DY=$(find . -name "QBLHook.dylib" | head -1)
          echo "dylib: $DY"
          if [ -n "$DY" ]; then
            ldid -S "$DY" || echo "ldid 签名失败，不影响越狱使用"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBLHook-dylib
          path: |
            .theos/obj/**/*.dylib
            **/*.dylib
          if-no-files-found: error
