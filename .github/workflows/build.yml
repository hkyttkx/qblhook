name: Build QBLHook dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk . 2>/dev/null || true
          rm -rf tmp
          ls "$THEOS/sdks"

      - name: Build and report
        run: |
          set +e
          make clean > /dev/null 2>&1
          make > build.log 2>&1
          EXIT=$?
          echo "MAKE_EXIT=$EXIT"
          # 逐行输出成 annotation（API 可读）
          sed -n '1,80p' build.log | sed 's/\r//g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=make::$line"
          done
          # 也放 summary
          {
            echo "## build.log"
            echo '```'
            cat build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          if [ $EXIT -ne 0 ]; then exit 1; fi

      - name: Find dylib
        run: find . -name "*.dylib" 2>/dev/null; find .theos -type f 2>/dev/null | head -30

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QBLHook-dylib
          path: "**/*.dylib"
          if-no-files-found: error
