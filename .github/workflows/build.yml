name: Build QBLHook

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -dynamiclib -fobjc-arc \
            -o QBLHook.dylib QBLHook.m \
            -framework Foundation -framework UIKit \
            -install_name @executable_path/Frameworks/QBLHook.dylib
          ls -la QBLHook.dylib

      - name: Commit dylib back to repo
        run: |
          mkdir -p dist
          cp QBLHook.dylib dist/
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add -f dist/QBLHook.dylib
          git commit -m "build: QBLHook.dylib [skip ci]" || echo "no change"
          git push
