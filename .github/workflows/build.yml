name: Build QBLHook dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk . 2>/dev/null || true
          rm -rf tmp
          ls -la

      - name: Build
        run: |
          make clean || true
          make
          echo "=== 全盘找 dylib ==="
          find . -name "*.dylib" 2>/dev/null
          echo "=== .theos 结构 ==="
          find .theos -type f 2>/dev/null | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBLHook-dylib
          path: |
            **/*.dylib
          if-no-files-found: error
