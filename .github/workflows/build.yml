name: Build QBLHook dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk . 2>/dev/null || true
          rm -rf tmp
          ls -la

      - name: Build
        id: b
        continue-on-error: true
        run: |
          make clean || true
          make > build.log 2>&1
          echo "make_exit=$?" >> $GITHUB_OUTPUT

      - name: Show tail in summary
        if: always()
        run: |
          echo "### Build log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Emit error annotation
        if: steps.b.outputs.make_exit != '0'
        run: |
          # 把日志尾部逐行打成 error annotation，API 可读
          tail -20 build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QBLHook-dylib
          path: |
            .theos/obj/**/*.dylib
            **/*.dylib
          if-no-files-found: error
