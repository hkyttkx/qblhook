name: Build QBLHook dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk . 2>/dev/null || true
          rm -rf tmp
          ls -la

      - name: Debug env
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks" || true
          ls "$THEOS/bin" || true
          echo "--- make version ---"
          make --version | head -1

      - name: Build
        run: |
          set -x
          make clean || true
          make 2>&1 | tee build.log
          echo "exit=$?"

      - name: Show log on failure
        if: failure()
        run: |
          echo "======== BUILD LOG ========"
          cat build.log || true
          echo "======== END ========"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QBLHook-dylib
          path: |
            .theos/obj/**/*.dylib
            **/*.dylib
          if-no-files-found: error

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
